# Names used to match news headlines to a ticker (whole words).
# Names with lowercase letters match case-insensitively; ALL-CAPS names (e.g. PPL)
# match case-sensitively. The cleaned company name (2+ words, case-sensitive) and
# the ticker are used too. The first 3 names also form the Google News query.
# Add names here when a company is in the top 30 but news calls it something else.
aliases:
  FFC: [Fauji Fertilizer, FFC]
  UBL: [United Bank, UBL]
  ENGROH: [Engro Holdings, Engro Corp, Engro Corporation]
  MEBL: [Meezan Bank, Meezan]
  OGDC: [OGDCL, Oil and Gas Development, Oil & Gas Development]
  HUBC: [Hub Power, Hubco]
  LUCK: [Lucky Cement]
  HBL: [Habib Bank, HBL]
  MARI: [Mari Energies, Mari Petroleum, Mari Gas]
  MCB: [MCB Bank]
  PPL: [Pakistan Petroleum, PPL]
  BAHL: [Bank Al Habib, Bank AL Habib]
  EFERT: [Engro Fertilizers, Engro Fertilizer]
  SYS: [Systems Limited, Systems Ltd]
  NBP: [National Bank of Pakistan, NBP]
  POL: [Pakistan Oilfields]
  BAFL: [Bank Alfalah]
  PSO: [Pakistan State Oil, PSO]
  MTL: [Millat Tractors]
  FCCL: [Fauji Cement]
  AKBL: [Askari Bank]
  FABL: [Faysal Bank]
  HMB: [Habib Metropolitan, HabibMetro]
  MLCF: [Maple Leaf Cement, Maple Leaf]
  FATIMA: [Fatima Fertilizer]
  DGKC: [DG Khan Cement, D.G. Khan Cement, DGKC]
  BOP: [Bank of Punjab]
  PSEL: [Pearl Continental, Pakistan Services Limited]
  ATRL: [Attock Refinery]
  SRVI: [Service Industries, Servis]
  SNGP: [Sui Northern, SNGPL]
  SSGC: [Sui Southern, SSGC]
  PAEL: [Pak Elektron]
  NML: [Nishat Mills]
  INDU: [Indus Motor, Toyota Indus]
  APL: [Attock Petroleum]
