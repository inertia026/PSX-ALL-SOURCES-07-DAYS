# Generic-sounding names: match only when not preceded by another capitalised word
# (so 'Fujiyama Power Systems Limited' is not Systems Limited).
strict_aliases: [Systems Limited, Systems Ltd, Service Industries, United Bank, National Bank of Pakistan]

# Ambiguous tickers that are also common words: match only via aliases above.
ticker_word_blocklist: [LUCK, MARI, SYS, POL, FATIMA, MTL, BOP]
